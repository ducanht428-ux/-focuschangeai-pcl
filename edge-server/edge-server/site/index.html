<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FocusChange AI - Giám sát và phân tích hành vi học sinh</title>
<meta name="description" content="Bản web của dashboard FocusChangeAI: đọc số đo thật từ SQLite của máy này, tự nối về dashboard cục bộ khi đang chạy; không hiển thị số liệu mẫu trừ khi gọi ?mode=demo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='12' fill='%231f6feb'/%3E%3Cpath d='M8 22s5.5-9 14-9 14 9 14 9-5.5 9-14 9-14-9-14-9z' fill='none' stroke='%23fff' stroke-width='2.4'/%3E%3Ccircle cx='22' cy='22' r='4.4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- Thanh bên trái: điều hướng 8 mục theo đặc tả 5.1 -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brand-logo"></div>
      <div class="brand-text">
        <strong>FocusChange AI</strong>
        <span>AI cho lớp học thông minh</span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="foot-chip" id="foot-chip"></div>
      <span>FocusChange AI v1.0</span>
    </div>
  </aside>

  <div id="main">
    <!-- Thanh trên cùng: lớp / offline / SQLite / mạng lớp (đặc tả 5.2) -->
    <header id="topbar">
      <div class="top-left">
        <button id="nav-toggle" type="button" title="Mở menu" aria-label="Mở menu điều hướng"></button>
        <span class="top-icon" id="top-class-icon"></span>
        <label class="class-picker">
          <select id="class-select" title="Chọn lớp"></select>
        </label>
      </div>
      <div class="top-right">
        <span class="chip-mode"><i class="dot dot-green"></i> Chế độ: <b>Offline (Xử lý tại máy)</b></span>
        <span class="top-sep"></span>
        <span class="chip-db" id="chip-db"></span>
        <span class="top-sep"></span>
        <button class="chip-lan" id="chip-lan" type="button"
          title="Mạng nội bộ lớp là tính năng giai đoạn 3 (chưa xây). Bấm để xem giải thích."></button>
      </div>
    </header>

    <div id="demo-banner" hidden></div>
    <main id="view"></main>
  </div>
</div>

<div id="modal-root" hidden></div>
<div id="toast-root"></div>
<div id="nav-scrim" hidden></div>
<script src="report-shared.js"></script>
<script src="demo-fixture.js"></script>
<script src="webdb-bridge.js"></script>
<script src="hosted-bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
